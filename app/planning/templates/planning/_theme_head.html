{% load static %}

<script>
    (function () {
        function appliquerTheme() {
            let theme = null;

            try {
                theme = localStorage.getItem("dispo-theme");
            } catch (e) {}

            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark" : "light";
            }

            document.documentElement.dataset.theme = theme;
        }

        appliquerTheme();

        window.addEventListener("storage", function (event) {
            if (event.key === "dispo-theme") {
                appliquerTheme();
            }
        });
    })();
</script>

<link rel="stylesheet" href="{% static 'planning/css/theme.css' %}">
