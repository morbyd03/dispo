services:
  web:
    ports: !reset []

    networks:
      - default
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-dispo}.rule=Host(`${DISPO_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-dispo}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-dispo}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-dispo}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-dispo}.service=${TRAEFIK_ROUTER:-dispo}"
      - "traefik.http.services.${TRAEFIK_ROUTER:-dispo}.loadbalancer.server.port=8000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
